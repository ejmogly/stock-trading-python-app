name: Cloud Backfill Execution (Tickers & Prices)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: true
        default: '2024-01-01'
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: true
        default: '2025-12-01'
      job_type:
        description: 'Target Job Type'
        required: true
        type: choice
        options:
          - 'monthly_tickers'
          - 'prices'
          - 'daily_tickers'

jobs:
  run-cloud-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Monthly Tickers Backfill
        if: ${{ inputs.job_type == 'monthly_tickers' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_TABLE: ${{ secrets.SNOWFLAKE_TABLE }}
        run: |
          python backfill.py --start ${{ inputs.start_date }} --end ${{ inputs.end_date }} --monthly

      - name: Run Cloud Price Backfill
        if: ${{ inputs.job_type == 'prices' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_PRICES_TABLE: "STOCK_PRICES"
        run: |
          python fetch_prices.py --start ${{ inputs.start_date }} --end ${{ inputs.end_date }}

      - name: Run Cloud Daily Tickers Backfill
        if: ${{ inputs.job_type == 'daily_tickers' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_TABLE: ${{ secrets.SNOWFLAKE_TABLE }}
        run: |
          python backfill.py --start ${{ inputs.start_date }} --end ${{ inputs.end_date }}
